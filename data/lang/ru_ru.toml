[forbiddenmagic.research_page.WRATHCAGE]
1 = "Иногда, недостаточно просто убить что-то или кого-то. Конечно, убийство одного монстра может быть хорошим очищением мира, но представьте как Вы просто выкашиваете толпы неприятных страшил.<BR><BR>С этой целью, Вы обнаружили способ воссоздать спаунеры монстров, которые Вы нашли в древних руинах. В отличие от обычных спаунеров монстров, клетка гнева реагирует на сигналы красного камня, а не на наличие человека и она работает намного быстрее древних аналогов."
2 = "Тем не менее, Вы не смогли воссоздать оригинальный метод бесконечного появления существ. За каждое существо клетка гнева требует немного эссенции, которую нужно передать по трубам. Устройство будет принимать разные типы эссенции в зависимости от привязанного существа. Также, Ira может служить, как топливо. Клетка также принимает Desidia.<BR><BR>Нажатие ПКМ по клетке гнева адскими вилами будет менять цикл клетки между разными видами топлива, меняя потребляемую эссенцию клеткой."
3 = "Чтобы привязать клетку гнева к определённому существу, нажмите ПКМ по ней с отпечатанным кристаллом в руке.  Убийство совместимого существа адскими вилами, имея при этом чистый отпечатанный кристалл, привяжет кристалл к этому монстру."

[forbiddenmagic.research_page.TAINTTREE]
1 = "Болезненные, искажённые отходы магических экспериментов могут обрести странную жизнь. Большинство растений не выживают в Скверных землях, но Вы нашли способ вырастить одно из них. Пропитав саженец скверной, Вы создаёте дерево, которое может процветать в Скверных землях.<BR><BR>Его древесину можно превратить в доски, устойчивые к волокнистой скверне, что позволяет строить сооружения, защищённые от её распространения.<BR><BR>Дерево, похоже, приносит плоды, но есть их не рекомендуется..."

[forbiddenmagic.research_page.TAINTSTONE]
1 = "Скверные земли — не самое безопасное место. Волокнистая скверна жадно расползается и заползает на большинство поверхностей, в конце концов покрывая их и делая непригодными для ходьбы. Впрочем, этим волокнам, похоже, не вредит ни скверное существо, ни скверный материал.<BR><BR>Смешав скверну с обычным камнем, Вы получили магический материал, структурно устойчивый, но сопротивляющийся распространению волокнистой скверны. Из скверного камня можно выкладывать в Скверных землях поверхности, по которым безопасно ходить.<BR><BR>Хотя строить в Скверных землях всё равно не рекомендуется..."

[forbiddenmagic.research_page.BLACKFLOWER]
1 = "Нет зрелища более жалкого, чем видеть мокрого тауматурга.  Несмотря на Ваши великие и магические силы, Вам все равно придётся идти прыгать в ближайшее озеро и устраивать охоту за спрутами каждый раз, когда Вы захотите пополнить Вашу чернильницу.<BR><BR>Прекращайте охотиться за спрутами! Соединяя розу с Tenebrae и Victus, Вы создаёте цветок, который распространяется как сорняк, и чьи лепестки могут быть раздавлены для создания чернил."

[forbiddenmagic.research_page.ARCANECAKE]
1 = "Если существует вещь, которую Вы любите, то это - торт. Вы бы ели его вкусную доброту весь день, если бы Вы могли, но она всегда заканчивается.<BR><BR>Чтобы исправить это, Вы написали рецепт, который наполняет торт магией долголетия.  Таумический торт заканчивается намного медленнее, чем земной, и он будет медленно себя восстанавливать, пока есть хотя бы кусочек.  Однако его чары нестабильны, как только Вы его поставили, торт нельзя будет перемещать обычными способами."

[forbiddenmagic.research_page.RIDINGCROP]
1 = "Хлыст, как подсказывает его название, это инструмент, используемый для побуждения животных, которых можно оседлать, двигаться быстрее.  Нажмите ПКМ с хлыстом в руке, когда Вы на лошади или на другом животном, и после удара животное будет двигаться быстрее в течение некоторого времени.<BR><BR>Вы можете ударить хлыстом и других животных, но что заставляет Вас делать это?"

[forbiddenmagic.research_page.RINGFOOD]
1 = "Люди продолжают ругать Вас. Они настаивают на том, что Вы не можете просто есть печенье весь день, или что \"питательность работает иначе\". Чтож, Вы получали питательность от этих скептиков.<BR><BR>Кольцо насыщения предоставляет усиление к пище и значениям насыщения большей части еды, которую Вы употребляете, пока кольцо одето на Вашем пальце.<BR><BR>Возможные побочные эффекты: тошнота, головные боли, судороги, головокружение, диабет и внезапный интерес к гомеопатии."

[forbiddenmagic.research_page.ROD_tainted]
1 = "Заражённые земли - это место великой и ужасной энергии для тех тауматургов, которые знают как её использовать.<BR><BR>Заражённый стержень может хранить до 150 Вис каждого типа и медленно пополнять каждый аспект до 10%, пока жезл находятся на заражённой земле.  Когда Вы держите жезл в руке, он также может питаться от заражения, бегущего по Вашим венам, случайно восстанавливая Вис, во время получении урона от порчи."

[forbiddenmagic.research_page.ROD_infernal]
1 = "Такой великий и могучий тауматург как Вы, заслуживает мощный и внушительный жезл, достойный Вашей станции. Серебродревесный жезл кажется Вам не таким уж и внушительным. Вам нужен жезл, который будет служить в качестве скипетра власти.<BR><BR> Вы обнаружили способ создания жезла, который наполнен силой Нижнего мира. Адский стержень может содержать до 150 Вис и он будет медленно пополнять запас Ignis до 20%. Если Вы будете находиться в Нижнем мире, жезл также будет пополнять другие аспекты до 10%."
2 = "Жезл также наделяет Вас какой-то защитой от опасностей Нижнего мира, он не даст Вам сгореть, если Вы стоите в огне, также он будет защищать Вас от иссушения, пока жезл находится в Вашем инвентаре. Когда жезл находится в руке, он будет полностью защищать Вас от всех повреждений огнём."

[forbiddenmagic.research_page.ROD_witchwood]
1 = "Создавая стержень из ведьминой древесины, Вы обнаружили способ преобразования маны в Вис.  Стержень из ведьминой древесины содержит до 100 Вис и постепенно заряжает себя ценой в 140 маны - одно очко Вис.<BR><BR>Дальнейшие исследования могут открыть способы понижения этой цены."

[forbiddenmagic.research_page.ROD_profane]
1 = "Иногда можно встретить странных деревенских жителей, которые добывают такие деревянные жезлы с вырезанными богохульными символами. Нечестивые жезлы черпают Вис из посредственного источника, но, похоже, способны очень быстро восполнять его из невидимого источника.<BR><BR>Иногда руны на жезле сдвигаются и истекают кровью, а сам жезл иногда шепчет о дьявольских контрактах и гнусных деяниях.<BR><BR>Длительное использование не рекомендуется."

[forbiddenmagic.research_page.ROD_witchwood_staff]
1 = "Жезл из ведьминой древесины \"пожирает\" слишком много магической силы и заряжается слишком медленно, чтобы быть устойчивым в бою. Вам кажется, что пора сделать что-то немного более эффективное, в направлении мистической силы.<BR><BR>В отличии от большинства жезлов, посох из ведьминой древесины может содержать только 50 Вис. Его истинная сила заключается в том, что он быстро заряжается. Посох восстанавливает Вис в два раза быстрее, чем жезл из ведьминой древесины. Кроме того, посох использует значительно меньшую магическую силу, чем жезл из ведьминой древесины и ему нужно только 100 маны за Вис, если он используется без соответствующего наконечника."

[forbiddenmagic.research_page.TRANSEMERALD]
1 = "Вы обнаружили способ удвоения изумрудов, погружая изумрудные осколки в Lucrum, добытых из других материалов."

[forbiddenmagic.research_page.CRYSTALWELL]
1 = "Соединение осколков стихий с Вашей чернильницей даёт Вам достаточно интересные эффекты. Кристальная чернильница с пером, кажется, поглощает знания, которые Вы ей записываете. После того как в чернильнице закончатся чернила, Вы можете поглотить это знание за небольшое количество очков исследования, держа чернильницу в руках и нажав ПКМ. К сожалению, это сжигает чернильницу и превращает её в земную чернильницу с пером."
1b = "Исследования иногда становятся скучными и утомительными. Есть лишь ограниченное число часов, которые Вы можете потратить на разбор кусков булыжника в безнадёжной надежде найти эзотерические знания, прежде чем Вы начнёте думать о смене карьеры.<BR><BR>К счастью, Вы придумали способ ускорить этот процесс. Кристальная чернильница с пером содержит небольшой запас тайного знания, которое медленно перетекает в Ваш разум, пока Вы носите её с собой.<BR><BR>Ваши чакры будут ПОЛНОСТЬЮ выровнены!"

[forbiddenmagic.research_page.PRIMEWELL]
1 = "Вы узнали то, что людям не суждено было узнать, увидели то, что людям не суждено было увидеть, и побывали в местах, куда людям не суждено было попасть.<BR><BR>Этот опыт научил Вас, как восполнять чернильницу.<BR><BR>Используя странные свойства Первородной Жемчужины, Вы можете создать набор письменных инструментов, который никогда не закончится чернилами. Когда холодный, тёмный конец времени погасит свет миллиона звёзд, Первобытные письменные инструменты всё ещё будут готовы писать дальше."

[forbiddenmagic.research_page.TAINTSHOVEL]
1 = "Иногда, самый простой способ убрать пятна заражения - просто физически убрать их.<BR><BR>Укрепляя таум-лопату серебряной древесиной и осколками порядка, Вы создали инструмент, который способен бороться с заражением.  Лопата очистителя может копать через вязкую заражённую почву так же эффективно, как через обычную землю.<BR><BR>Если Вы возьмёте её в руки и нажмёте ПКМ, лопата очистит всю заражённую слизь и газ в небольшом радиусе, за счёт прочности. Вам больше не придётся убирать неудачи наполнения куском булыжника!"
2 = "Когда Вы копаете заражение лопатой, есть шанс, что выпущенная энергия кристаллизуется в осколки заразы.  В отличие от других заражённых материалов, кристаллическая структура держит эти осколки в стабильности, что позволяет носить их с собой."

[forbiddenmagic.research_page.TAINTPICK]
1 = "Наполняя таум-кирку заражением, Вы создали инструмент, который способен добывать твёрдые материалы.<BR><BR>Кирка искажения заражает твёрдые материалы, ослабляя их. Чем твёрже материал, тем эффективнее кирка добывает его. К сожалению, последствия заражения имеют обратный эффект, и при добыче более мягких материалов кирка добывает их медленней, даже медленнее руки."

[forbiddenmagic.research_page.FOCUSBLINK]
1 = "Ужас.<BR><BR>Ничто не ужаснее, чем вставать, кроме необходимости куда-то идти. Столько рррработы. Какой смысл быть великим модным волшебником, если приходится использовать ноги, как все остальные?<BR><BR>Фокус телепортации облегчает тяготы необходимости ставить одну ногу перед другой. Просто наведите жезл на дальнее место и взмахните им, чтобы телепортироваться туда.<BR><BR>Теперь Вам нужен только фокус Душа, и всё будет готово..."

