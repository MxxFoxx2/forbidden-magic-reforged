[forbiddenmagic.research_page.WRATHCAGE]
1 = "Иногда недостаточно убить что-то один раз. Вы реконструировали спаунеры монстров из древних руин, но заставили свои подчиняться красному камню вместо присутствия игрока. Клетка гнева реагирует на сигнал красного камня: с сигналом она останавливается, без сигнала — продолжает цикл. Она также работает намного быстрее древних аналогов."
2 = "Тем не менее, вы не смогли воссоздать оригинальный метод бесконечного появления существ. За каждое существо клетка гнева требует немного эссенции, которую нужно передать по трубам. Устройство принимает разные типы эссенции в зависимости от привязанного существа. Ira также может служить топливом. Клетка также принимает Desidia, но это добавляет существенную задержку к следующему циклу."
3 = "Нажмите ПКМ по клетке отпечатанным кристаллом, чтобы привязать её. Если клетка уже была привязана, предыдущий отпечаток вернётся прямо в руку. Разрушение клетки также освобождает её кристалл. Чтобы отпечатать кристалл, убейте совместимого моба с пустым кристаллом в инвентаре."

[forbiddenmagic.research_page.TAINTTREE]
1 = "Болезненные, искажённые отходы магических экспериментов могут обрести странную жизнь. Большинство растений не выживают в Скверных землях, но Вы нашли способ вырастить одно из них. Пропитав саженец скверной, Вы создаёте дерево, которое может процветать в Скверных землях.<BR><BR>Его древесину можно превратить в доски, устойчивые к волокнистой скверне, что позволяет строить сооружения, защищённые от её распространения.<BR><BR>Дерево, похоже, приносит плоды, но есть их не рекомендуется..."

[forbiddenmagic.research_page.TAINTSTONE]
1 = "Скверные земли — не самое безопасное место. Волокнистая скверна жадно расползается и заползает на большинство поверхностей, в конце концов покрывая их и делая непригодными для ходьбы. Впрочем, этим волокнам, похоже, не вредит ни скверное существо, ни скверный материал.<BR><BR>Смешав скверну с обычным камнем, Вы получили магический материал, структурно устойчивый, но сопротивляющийся распространению волокнистой скверны. Из скверного камня можно выкладывать в Скверных землях поверхности, по которым безопасно ходить.<BR><BR>Хотя строить в Скверных землях всё равно не рекомендуется..."

[forbiddenmagic.research_page.BLACKFLOWER]
1 = "Нет зрелища более жалкого, чем промокший тауматург.  При всех Ваших великих и чудесных силах Вам всё ещё приходится прыгать в ближайшее озеро и охотиться на кальмаров каждый раз, когда нужно пополнить чернильницу.<BR><BR>С охота на кальмаров покончено.  Наполнив розу тенеброй и виктусом, Вы создаёте цветок, который разрастается как сорняк, а его лепестки можно растолочь в чернила."

[forbiddenmagic.research_page.ARCANECAKE]
1 = "Если существует вещь, которую Вы любите, то это - торт. Вы бы ели его вкусную доброту весь день, если бы Вы могли, но она всегда заканчивается.<BR><BR>Чтобы исправить это, Вы написали рецепт, который наполняет торт магией долголетия.  Таумический торт заканчивается намного медленнее, чем земной, и он будет медленно себя восстанавливать, пока есть хотя бы кусочек.  Однако его чары нестабильны, как только Вы его поставили, торт нельзя будет перемещать обычными способами."

