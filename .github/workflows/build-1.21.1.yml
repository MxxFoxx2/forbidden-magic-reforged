name: Build Minecraft 1.21.1 port

on:
  push:
    branches: ["1.21.1"]
  pull_request:
    branches: ["1.21.1"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-1.21.1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/1.21.1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout addon
        uses: actions/checkout@v7
        with:
          path: forbidden-magic-reforged

      - name: Checkout pinned Thaumcraft source
        uses: actions/checkout@v7
        with:
          repository: notlikethiss/thaumcraft-4-reforged
          ref: 2beb6871123328968bbdba3ae4872d09d3ab1510
          path: thaumcraft-4-reforged
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/1.21.1' }}

      - name: Prepare pinned host and apply local patches
        working-directory: forbidden-magic-reforged
        run: python tools/prepare_host.py

      - name: Verify prepared host
        working-directory: forbidden-magic-reforged
        run: python tools/prepare_host.py --verify

      - name: Build host
        working-directory: forbidden-magic-reforged/host
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Build addon
        working-directory: forbidden-magic-reforged
        run: ./gradlew build

      - name: Verify addon artifact provenance
        working-directory: forbidden-magic-reforged
        run: python tools/check_provenance.py

      - name: Run GameTests
        working-directory: forbidden-magic-reforged
        run: ./gradlew runGameTestServer

      - name: Upload 1.21.1 mod JAR
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: forbidden-magic-1.21.1-${{ github.sha }}
          path: forbidden-magic-reforged/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
