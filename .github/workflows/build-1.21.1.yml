name: Build Minecraft 1.21.1 port

on:
  push:
    branches: ["1.21.1"]
  pull_request:
    branches: ["1.21.1"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-1.21.1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/1.21.1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout addon
        uses: actions/checkout@v4
        with:
          path: forbidden-magic-reforged

      - name: Checkout pinned Thaumcraft source
        uses: actions/checkout@v4
        with:
          repository: notlikethiss/thaumcraft-4-reforged
          ref: 2beb6871123328968bbdba3ae4872d09d3ab1510
          path: thaumcraft-4-reforged
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test release tooling
        working-directory: forbidden-magic-reforged
        run: python -m unittest discover -s tests/python -v

      - name: Verify generated resources are fresh
        working-directory: forbidden-magic-reforged
        run: |
          python tools/gen_resources.py
          git diff --exit-code -- src/generated

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            forbidden-magic-reforged/gradle/wrapper/gradle-wrapper.properties
            thaumcraft-4-reforged/gradle/wrapper/gradle-wrapper.properties

      - name: Check host-agnostic architecture boundary
        working-directory: forbidden-magic-reforged
        run: python tools/check_host_agnostic_boundary.py

      - name: Check client resource integrity
        working-directory: forbidden-magic-reforged
        run: python tools/check_client_assets.py

      - name: Prepare pinned host and apply local patches
        working-directory: forbidden-magic-reforged
        run: python tools/prepare_host.py

      - name: Verify prepared host
        working-directory: forbidden-magic-reforged
        run: python tools/prepare_host.py --verify

      - name: Build host
        working-directory: forbidden-magic-reforged/host
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build

      - name: Run unit tests
        working-directory: forbidden-magic-reforged
        run: ./gradlew --no-daemon test

      - name: Build addon
        working-directory: forbidden-magic-reforged
        run: ./gradlew --no-daemon build

      - name: Verify addon artifact provenance
        working-directory: forbidden-magic-reforged
        run: python tools/check_provenance.py

      - name: Run GameTests
        working-directory: forbidden-magic-reforged
        run: ./gradlew --no-daemon runGameTestServer

      - name: Run GameTests with Luxuria disabled
        working-directory: forbidden-magic-reforged
        run: |
          python tools/set_startup_config.py no_lust=true
          ./gradlew --no-daemon runGameTestServer

      - name: Upload 1.21.1 mod JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forbidden-magic-1.21.1-${{ github.sha }}
          path: forbidden-magic-reforged/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
