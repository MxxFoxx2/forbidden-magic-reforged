name: Java CI with Gradle

on:
  push:
    branches: ["main", "architecture/host-agnostic-core"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "NOTICE"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "NOTICE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout mod
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test release version helper
        run: python -m unittest discover -s tests/python -v

      - name: Verify host-agnostic API boundary
        run: python tools/check_host_agnostic_api.py

      - name: Clone host upstream
        run: git clone https://github.com/notlikethiss/thaumcraft-4-reforged.git ../thaumcraft-4-reforged

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Prepare host (pin + patches)
        run: |
          git config --global user.email "ci@github-actions.local"
          git config --global user.name "GitHub Actions"
          python tools/prepare_host.py
          python tools/prepare_host.py --verify

      - name: Build patched host
        working-directory: host
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Build mod
        run: ./gradlew build

      - name: Verify mod artifact provenance
        run: python tools/check_provenance.py

      - name: Verify generated resources are fresh
        run: |
          python tools/gen_resources.py
          git diff --exit-code -- src/generated

      - name: Run GameTests with Luxuria enabled
        run: ./gradlew runGameTestServer

      - name: Run GameTests with Luxuria disabled
        run: |
          python tools/set_startup_config.py no_lust=true
          ./gradlew runGameTestServer

      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: forbidden-magic-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
