name: Java CI with Gradle

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout mod
        uses: actions/checkout@v4

      # prepare_host.py ждёт upstream рядом: ../thaumcraft-4-reforged
      - name: Clone host upstream
        run: |
          git clone https://github.com/notlikethiss/thaumcraft-4-reforged.git ../thaumcraft-4-reforged

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Prepare host (pin + patches)
        run: |
          git config --global user.email "ci@github-actions.local"
          git config --global user.name "GitHub Actions"
          python3 tools/prepare_host.py

      - name: Build and publish host to local maven/
        working-directory: host
        run: |
          chmod +x gradlew
          ./gradlew build publish --no-daemon
        # 0003: group thaumcraft:thaumcraft:1.2 → ../maven (то есть maven/ у корня мода)

      - name: Verify local maven artifact
        run: |
          test -d maven/thaumcraft/thaumcraft/1.2
          ls -la maven/thaumcraft/thaumcraft/1.2/

      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Run GameTests with Luxuria enabled
        run: ./gradlew runGameTestServer --no-daemon

      - name: Run GameTests with Luxuria disabled
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          config = Path("run/config/forbiddenmagic-startup.toml")
          if not config.is_file():
              raise SystemExit(f"Expected startup config was not generated: {config}")

          original = config.read_text(encoding="utf-8")
          pattern = re.compile(r"(?m)^([ \\t]*no_lust[ \\t]*=[ \\t]*)false([ \\t]*(?:#.*)?[ \\t]*$)")
          updated, count = pattern.subn(r"\\1true\\2", original)
          if count != 1:
              raise SystemExit(f"Expected exactly one no_lust = false setting, found {count}")

          config.write_text(updated, encoding="utf-8")
          print(f"Set no_lust=true in {config}")
          PY
          ./gradlew runGameTestServer --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: forbidden-magic-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      # Не заливать jar хоста — он All Rights Reserved
