name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout mod
        uses: actions/checkout@v4

      - name: Clone host upstream
        run: git clone https://github.com/notlikethiss/thaumcraft-4-reforged.git ../thaumcraft-4-reforged

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare host (pin + patches)
        run: |
          git config --global user.email "ci@github-actions.local"
          git config --global user.name "GitHub Actions"
          python3 tools/prepare_host.py

      - name: Build patched host
        working-directory: host
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Build mod
        run: ./gradlew build --no-daemon

      - name: Verify mod artifact provenance
        run: python3 tools/check_provenance.py

      - name: Verify generated resources are fresh
        run: |
          python3 tools/gen_resources.py
          git diff --exit-code -- src/generated

      - name: Run GameTests with Luxuria enabled
        run: ./gradlew runGameTestServer --no-daemon

      - name: Run GameTests with Luxuria disabled
        run: |
          python3 tools/set_startup_config.py no_lust=true
          ./gradlew runGameTestServer --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: forbidden-magic-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
