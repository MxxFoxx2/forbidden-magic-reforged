
name: Publish version-specific rolling releases

on:
  push:
    branches: [main, "1.21.1", "mc/26.1.2"]
    # Publish only when shipped code, resources, generated inputs or host
    # preparation changes. Tests and validation scripts run in CI but do not
    # change the distributable JAR, so they must not bump the rolling release.
    # Add new shipped build inputs here when they are introduced.
    paths:
      - "src/**"
      - "data/**"
      - "tools/gen/**"
      - "tools/gen_resources.py"
      - "tools/prepare_host.py"
      - "patches/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "host.sha"
      - "release-version.txt"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Optional commit or tag to build and publish; defaults to the selected branch head"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test, and update the matching Minecraft release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout Minecraft 26.3 source
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref != '' && inputs.source_ref || github.sha }}
          fetch-depth: 0

      - name: Checkout port branch source
        if: github.ref != 'refs/heads/main'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref != '' && inputs.source_ref || github.sha }}
          path: port/forbidden-magic-reforged
          fetch-depth: 0

      - name: Determine channel and validate source
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/main)
              channel="26.3"
              repo_dir="."
              expected_mc="26.3"
              java_version="25"
              ;;
            refs/heads/1.21.1)
              channel="1.21.1"
              repo_dir="port/forbidden-magic-reforged"
              expected_mc="1.21.1"
              java_version="21"
              ;;
            refs/heads/mc/26.1.2)
              channel="26.1.2"
              repo_dir="port/forbidden-magic-reforged"
              expected_mc="26.1.2"
              java_version="25"
              ;;
            *)
              echo "Run this workflow from main (26.3), 1.21.1 or mc/26.1.2 only." >&2
              exit 1
              ;;
          esac
          if [[ "$repo_dir" != "." ]]; then
            host_sha="$(tr -d '[:space:]' < "$repo_dir/host.sha")"
            if [[ ! "$host_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid host.sha: $host_sha" >&2
              exit 1
            fi
            echo "host_sha=$host_sha" >> "$GITHUB_OUTPUT"
          fi

          source_sha="$(git -C "$repo_dir" rev-parse HEAD)"
          actual_mc="$(sed -n 's/^minecraft_version=//p' "$repo_dir/gradle.properties" | head -n1)"
          if [[ "$actual_mc" != "$expected_mc" ]]; then
            echo "Refusing to publish $channel: source targets Minecraft '$actual_mc', expected '$expected_mc'." >&2
            exit 1
          fi

          base_version="$(tr -d '[:space:]' < "$repo_dir/release-version.txt")"
          previous_version=""
          if gh release view "release/$channel" --repo "$REPO" >/dev/null 2>&1; then
            previous_version="$(gh release view "release/$channel" --repo "$REPO" --json name,body               | python3 -c 'import json,re,sys; d=json.load(sys.stdin); m=re.search(r"<!-- release-version: ([0-9]+\.[0-9]+\.[0-9]+) -->", d.get("body") or ""); print(m.group(1) if m else (re.match(r"([0-9]+\.[0-9]+\.[0-9]+)", d.get("name") or "") or [None,""])[1])')"
          fi
          release_version="$(python3 "$repo_dir/tools/prepare_release_version.py" "$base_version" "$previous_version" "$repo_dir/gradle.properties" "$channel")"
          mod_version="$release_version-$channel"

          {
            echo "channel=$channel"
            echo "repo_dir=$repo_dir"
            echo "expected_mc=$expected_mc"
            echo "java_version=$java_version"
            echo "source_sha=$source_sha"
            echo "release_version=$release_version"
            echo "mod_version=$mod_version"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing Minecraft $channel from $source_sha as mod version $mod_version"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up matching Java toolchain
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.meta.outputs.java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Clone Thaumcraft host for Minecraft 26.3
        if: steps.meta.outputs.channel == '26.3'
        run: git clone https://github.com/notlikethiss/thaumcraft-4-reforged.git ../thaumcraft-4-reforged

      - name: Checkout pinned Thaumcraft host for port branches
        if: steps.meta.outputs.channel != '26.3'
        uses: actions/checkout@v7
        with:
          repository: notlikethiss/thaumcraft-4-reforged
          ref: ${{ steps.meta.outputs.host_sha }}
          path: port/thaumcraft-4-reforged
          fetch-depth: 0

      - name: Prepare and patch Thaumcraft host
        working-directory: ${{ steps.meta.outputs.repo_dir }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.email "ci@github-actions.local"
          git config --global user.name "GitHub Actions"
          python3 tools/prepare_host.py

      - name: Verify prepared host for port branches
        if: steps.meta.outputs.channel != '26.3'
        working-directory: ${{ steps.meta.outputs.repo_dir }}
        run: python3 tools/prepare_host.py --verify

      - name: Build host
        working-directory: ${{ steps.meta.outputs.repo_dir }}/host
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Build add-on
        working-directory: ${{ steps.meta.outputs.repo_dir }}
        run: ./gradlew build

      - name: Verify add-on artifact provenance
        working-directory: ${{ steps.meta.outputs.repo_dir }}
        run: python3 tools/check_provenance.py

      - name: Run GameTests
        working-directory: ${{ steps.meta.outputs.repo_dir }}
        run: ./gradlew runGameTestServer

      - name: Run GameTests with Luxuria disabled (26.x)
        if: steps.meta.outputs.channel != '1.21.1'
        working-directory: ${{ steps.meta.outputs.repo_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/set_startup_config.py no_lust=true
          ./gradlew runGameTestServer

      - name: Prepare stable release assets
        id: asset
        shell: bash
        env:
          REPO_DIR: ${{ steps.meta.outputs.repo_dir }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          RELEASE_VERSION: ${{ steps.meta.outputs.release_version }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
        run: |
          set -euo pipefail
          repo_abs="$(cd "$REPO_DIR" && pwd)"
          asset_name="forbidden-magic-$RELEASE_VERSION-$CHANNEL.jar"
          asset="$repo_abs/build/libs/$asset_name"
          test -s "$asset"
          echo "jar_path=$asset" >> "$GITHUB_OUTPUT"

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          RELEASE_VERSION: ${{ steps.meta.outputs.release_version }}
          MC_VERSION: ${{ steps.meta.outputs.expected_mc }}
          REPO_DIR: ${{ steps.meta.outputs.repo_dir }}
          JAR_PATH: ${{ steps.asset.outputs.jar_path }}
        shell: bash
        run: |
          set -euo pipefail
          # Channel tags live under release/ so they never collide with the
          # 1.21.1 branch name (a bare "1.21.1" tag made every release look
          # like a fresh push to the branch in GitHub's UI).
          CHANNEL_TAG="release/$CHANNEL"
          TITLE="$RELEASE_VERSION (NeoForge $CHANNEL)"

          git -C "$REPO_DIR" config user.email "ci@github-actions.local"
          git -C "$REPO_DIR" config user.name "GitHub Actions"

          if [[ "$CHANNEL" == "26.3" ]]; then
            TAG_TARGET="$SOURCE_SHA"

            # GITHUB_TOKEN cannot create or update a tag whose .github/workflows tree
            # differs from the existing tag (it lacks the `workflows` permission).
            # Workflow-only commits do not trigger this workflow, so main's workflows
            # can drift ahead of the rolling tag. Freeze the tag's workflow tree at the
            # existing tag's version and parent the snapshot to it, so the ref update
            # never presents a workflow delta. The tested source tree stays intact.
            if git -C "$REPO_DIR" fetch --force origin "refs/tags/$CHANNEL_TAG:refs/tags/$CHANNEL_TAG" 2>/dev/null; then
              WORKFLOW_BASE="$(git -C "$REPO_DIR" rev-parse "refs/tags/$CHANNEL_TAG^{commit}")"
            else
              WORKFLOW_BASE="$(git -C "$REPO_DIR" rev-parse "$SOURCE_SHA^")"
            fi
            if ! git -C "$REPO_DIR" diff --quiet "$WORKFLOW_BASE" "$SOURCE_SHA" -- .github/workflows; then
              TREE_WORKDIR="$RUNNER_TEMP/release-source-tree-main"
              git -C "$REPO_DIR" worktree add --detach "$TREE_WORKDIR" "$WORKFLOW_BASE"
              git -C "$TREE_WORKDIR" rm -r --cached -f .
              git -C "$TREE_WORKDIR" clean -fdx
              git -C "$REPO_DIR" archive "$SOURCE_SHA" | tar -xf - -C "$TREE_WORKDIR"
              git -C "$TREE_WORKDIR" checkout --force "$WORKFLOW_BASE" -- .github/workflows
              git -C "$TREE_WORKDIR" add -A
              TREE_SHA="$(git -C "$TREE_WORKDIR" write-tree)"
              TAG_TARGET="$(printf 'Release snapshot for Minecraft %s; source %s\n' "$CHANNEL" "$SOURCE_SHA" | git -C "$TREE_WORKDIR" commit-tree "$TREE_SHA" -p "$WORKFLOW_BASE")"
              git -C "$REPO_DIR" worktree remove "$TREE_WORKDIR" --force
              echo "Created rolling-release tag target without workflow-file changes: $TAG_TARGET"
            fi
          else
            # GitHub's built-in GITHUB_TOKEN cannot create a release tag directly on a
            # commit that changes .github/workflows relative to main. Build a snapshot
            # from the exact 1.21.1 tree while inheriting main's workflow directory.
            # GitHub-generated source archives point to this snapshot; release notes
            # retain the original port-source SHA.
            git -C "$REPO_DIR" fetch origin main:refs/remotes/origin/main
            MAIN_SHA="$(git -C "$REPO_DIR" rev-parse refs/remotes/origin/main)"
            TREE_WORKDIR="$RUNNER_TEMP/release-source-tree"
            git -C "$REPO_DIR" worktree add --detach "$TREE_WORKDIR" "$MAIN_SHA"
            git -C "$TREE_WORKDIR" rm -r --cached -f .
            git -C "$TREE_WORKDIR" clean -fdx
            git -C "$REPO_DIR" archive "$SOURCE_SHA" | tar -xf - -C "$TREE_WORKDIR"
            git -C "$TREE_WORKDIR" checkout --force "$MAIN_SHA" -- .github/workflows
            git -C "$TREE_WORKDIR" add -A
            TREE_SHA="$(git -C "$TREE_WORKDIR" write-tree)"
            TAG_TARGET="$(printf 'Release snapshot for Minecraft 1.21.1; source %s\n' "$SOURCE_SHA" | git -C "$TREE_WORKDIR" commit-tree "$TREE_SHA" -p "$MAIN_SHA")"
            git -C "$REPO_DIR" worktree remove "$TREE_WORKDIR" --force
          fi

          PREVIOUS_BODY=""
          if gh release view "$CHANNEL_TAG" --repo "$REPO" >/dev/null 2>&1; then
            PREVIOUS_BODY="$(gh release view "$CHANNEL_TAG" --repo "$REPO" --json body --jq .body)"
          fi
          export PREVIOUS_BODY

          NOTES_FILE="$RUNNER_TEMP/release-notes-$CHANNEL.md"
          python3 "$REPO_DIR/tools/generate_release_notes.py" "$NOTES_FILE"

          git -C "$REPO_DIR" tag -f -a "$CHANNEL_TAG" "$TAG_TARGET" -m "Latest tested Minecraft $CHANNEL build from source $SOURCE_SHA"
          git -C "$REPO_DIR" push --force origin "refs/tags/$CHANNEL_TAG"

          # Recreate the rolling release instead of editing it: GitHub derives the
          # "released ..." date from the release, not from the asset, so an edit would
          # keep showing the first build date. The channel tag remains the moving
          # pointer to the latest tested source.
          if gh release view "$CHANNEL_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release delete "$CHANNEL_TAG" --repo "$REPO" --yes --cleanup-tag=false
          fi
          # 26.3 is the primary channel and keeps the GitHub "Latest" mark; the
          # secondary channel is created without it so the two rolling releases
          # do not steal the badge from each other on every build.
          LATEST_FLAG="--latest=false"
          if [[ "$CHANNEL" == "26.3" ]]; then
            LATEST_FLAG="--latest"
          fi
          gh release create "$CHANNEL_TAG" --repo "$REPO" --target "$TAG_TARGET" --title "$TITLE" --notes-file "$NOTES_FILE" $LATEST_FLAG

          # This is a rolling release, not a build archive: remove only assets managed
          # by this workflow before uploading the current, predictable filenames.
          RELEASE_ID="$(gh api "repos/$REPO/releases/tags/${CHANNEL_TAG//\//%2F}" --jq .id)"
          while read -r ASSET_ID ASSET_NAME; do
            [[ -n "$ASSET_ID" && -n "$ASSET_NAME" ]] || continue
            if [[ "$ASSET_NAME" == forbidden-magic-* ]]; then
              gh api "repos/$REPO/releases/assets/$ASSET_ID" --method DELETE >/dev/null
              echo "Removed obsolete release asset: $ASSET_NAME"
            fi
          done < <(gh api "repos/$REPO/releases/$RELEASE_ID/assets?per_page=100" --jq '.[] | [.id, .name] | @tsv')

          gh release upload "$CHANNEL_TAG" "$JAR_PATH" --repo "$REPO"
          echo "Updated release $CHANNEL_TAG from $SOURCE_SHA. The other Minecraft channel was not touched."
