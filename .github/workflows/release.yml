name: Release

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-version tag to build and publish (for example 0.1.0-beta.2)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Validate tag and set artifact version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$ ]]; then
            echo "Unsupported tag '$RELEASE_TAG'. Use MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-(alpha|beta|rc).N." >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          properties = Path("gradle.properties")
          original = properties.read_text(encoding="utf-8")
          updated, count = re.subn(
              r"(?m)^mod_version=.*$",
              f"mod_version=0.574-26.3-port.{tag}",
              original,
          )
          if count != 1:
              raise SystemExit(f"Expected exactly one mod_version entry; found {count}")
          properties.write_text(updated, encoding="utf-8")
          print(f"Building release {tag} as mod_version=0.574-26.3-port.{tag}")
          PY
          test -s "docs/releases/$RELEASE_TAG.md" || {
            echo "Missing release notes: docs/releases/$RELEASE_TAG.md" >&2
            exit 1
          }

      - name: Clone host upstream
        run: git clone https://github.com/notlikethiss/thaumcraft-4-reforged.git ../thaumcraft-4-reforged

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare host (pinned commit + local patches)
        run: |
          git config --global user.email "ci@github-actions.local"
          git config --global user.name "GitHub Actions"
          python3 tools/prepare_host.py

      - name: Build and publish host to local Maven
        working-directory: host
        run: |
          chmod +x gradlew
          ./gradlew build publish --no-daemon

      - name: Verify local Maven artifact
        run: test -d maven/thaumcraft/thaumcraft/1.2

      - name: Build mod
        run: ./gradlew build --no-daemon

      - name: Verify mod artifact provenance
        run: python3 tools/check_provenance.py

      - name: Run GameTests with Luxuria enabled
        run: ./gradlew runGameTestServer --no-daemon

      - name: Run GameTests with Luxuria disabled
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          config = Path("run/config/forbiddenmagic-startup.toml")
          if not config.is_file():
              raise SystemExit(f"Expected startup config was not generated: {config}")

          original = config.read_text(encoding="utf-8")
          pattern = re.compile(r"(?m)^([ \t]*no_lust[ \t]*=[ \t]*)false([ \t]*(?:#.*)?[ \t]*$)")
          updated, count = pattern.subn(r"\1true\2", original)
          if count != 1:
              raise SystemExit(f"Expected exactly one no_lust = false setting, found {count}")
          config.write_text(updated, encoding="utf-8")
          print(f"Set no_lust=true in {config}")
          PY
          ./gradlew runGameTestServer --no-daemon

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          JAR="build/libs/forbidden-magic-0.574-26.3-port.$TAG.jar"
          NOTES="docs/releases/$TAG.md"
          test -s "$JAR"
          test -s "$NOTES"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release '$TAG' already exists; refusing to overwrite an existing published release." >&2
            exit 1
          fi

          RELEASE_ARGS=("$TAG" "$JAR" --title "$TAG (NeoForge 26.3)" --notes-file "$NOTES")
          if [[ "$TAG" == *-* ]]; then
            RELEASE_ARGS+=(--prerelease)
          fi
          gh release create "${RELEASE_ARGS[@]}"
