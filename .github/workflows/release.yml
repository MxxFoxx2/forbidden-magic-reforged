
name: Publish version-specific rolling releases

on:
  push:
    branches: [main, "1.21.1"]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Optional commit, tag, or archive/releases/<version>/<sha> tag to publish (rollback)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test, and update the matching Minecraft release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Minecraft 26.3 source
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref != '' && inputs.source_ref || github.sha }}
          fetch-depth: 0

      - name: Checkout Minecraft 1.21.1 source
        if: github.ref == 'refs/heads/1.21.1'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref != '' && inputs.source_ref || github.sha }}
          path: port/forbidden-magic-reforged
          fetch-depth: 0

      - name: Determine channel and validate source
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            channel="26.3"
            repo_dir="."
            expected_mc="26.3"
            java_version="25"
            host_sha=""
          elif [[ "$GITHUB_REF" == "refs/heads/1.21.1" ]]; then
            channel="1.21.1"
            repo_dir="port/forbidden-magic-reforged"
            expected_mc="1.21.1"
            java_version="21"
            host_sha="$(tr -d '[:space:]' < "$repo_dir/host.sha")"
            if [[ ! "$host_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid host.sha: $host_sha" >&2
              exit 1
            fi
            echo "host_sha=$host_sha" >> "$GITHUB_OUTPUT"
          else
            echo "Run this workflow from main (26.3) or 1.21.1 only." >&2
            exit 1
          fi

          source_sha="$(git -C "$repo_dir" rev-parse HEAD)"
          actual_mc="$(sed -n 's/^minecraft_version=//p' "$repo_dir/gradle.properties" | head -n1)"
          if [[ "$actual_mc" != "$expected_mc" ]]; then
            echo "Refusing to publish $channel: source targets Minecraft '$actual_mc', expected '$expected_mc'." >&2
            exit 1
          fi

          build_version="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          release_version="1.0.$GITHUB_RUN_NUMBER"
          mod_version="0.574-$channel-port.$release_version"
          python3 - "$repo_dir/gradle.properties" "$mod_version" <<'PY'
          import re
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          content, count = re.subn(
              r"(?m)^mod_version=.*$",
              f"mod_version={sys.argv[2]}",
              path.read_text(encoding="utf-8"),
          )
          if count != 1:
              raise SystemExit(f"Expected one mod_version entry; found {count}")
          path.write_text(content, encoding="utf-8")
          PY

          {
            echo "channel=$channel"
            echo "repo_dir=$repo_dir"
            echo "expected_mc=$expected_mc"
            echo "java_version=$java_version"
            echo "source_sha=$source_sha"
            echo "build_version=$build_version"
            echo "release_version=$release_version"
            echo "mod_version=$mod_version"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing Minecraft $channel from $source_sha as mod version $mod_version"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up matching Java toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.meta.outputs.java_version }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clone Thaumcraft host for Minecraft 26.3
        if: steps.meta.outputs.channel == '26.3'
        run: git clone https://github.com/notlikethiss/thaumcraft-4-reforged.git ../thaumcraft-4-reforged

      - name: Checkout pinned Thaumcraft host for Minecraft 1.21.1
        if: steps.meta.outputs.channel == '1.21.1'
        uses: actions/checkout@v4
        with:
          repository: notlikethiss/thaumcraft-4-reforged
          ref: ${{ steps.meta.outputs.host_sha }}
          path: port/thaumcraft-4-reforged
          fetch-depth: 0

      - name: Prepare and patch Thaumcraft host
        working-directory: ${{ steps.meta.outputs.repo_dir }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.email "ci@github-actions.local"
          git config --global user.name "GitHub Actions"
          python3 tools/prepare_host.py

      - name: Verify prepared host for Minecraft 1.21.1
        if: steps.meta.outputs.channel == '1.21.1'
        working-directory: ${{ steps.meta.outputs.repo_dir }}
        run: python3 tools/prepare_host.py --verify

      - name: Build host
        working-directory: ${{ steps.meta.outputs.repo_dir }}/host
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build

      - name: Build add-on
        working-directory: ${{ steps.meta.outputs.repo_dir }}
        run: ./gradlew --no-daemon build

      - name: Verify add-on artifact provenance
        working-directory: ${{ steps.meta.outputs.repo_dir }}
        run: python3 tools/check_provenance.py

      - name: Run GameTests
        working-directory: ${{ steps.meta.outputs.repo_dir }}
        run: ./gradlew --no-daemon runGameTestServer

      - name: Run GameTests with Luxuria disabled (26.3)
        if: steps.meta.outputs.channel == '26.3'
        working-directory: ${{ steps.meta.outputs.repo_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          config = Path("run/config/forbiddenmagic-startup.toml")
          if not config.is_file():
              raise SystemExit(f"Expected startup config was not generated: {config}")
          original = config.read_text(encoding="utf-8")
          pattern = re.compile(r"(?m)^([ \t]*no_lust[ \t]*=[ \t]*)false([ \t]*(?:#.*)?[ \t]*$)")
          updated, count = pattern.subn(r"\1true\2", original)
          if count != 1:
              raise SystemExit(f"Expected exactly one no_lust = false setting, found {count}")
          config.write_text(updated, encoding="utf-8")
          print(f"Set no_lust=true in {config}")
          PY
          ./gradlew --no-daemon runGameTestServer

      - name: Prepare stable release assets
        id: asset
        shell: bash
        env:
          REPO_DIR: ${{ steps.meta.outputs.repo_dir }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          RELEASE_VERSION: ${{ steps.meta.outputs.release_version }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
        run: |
          set -euo pipefail
          repo_abs="$(cd "$REPO_DIR" && pwd)"
          built="$repo_abs/build/libs/forbidden-magic-0.574-$CHANNEL-port.$RELEASE_VERSION.jar"
          test -s "$built"
          asset_name="forbidden-magic-$RELEASE_VERSION-$CHANNEL.jar"
          asset="$repo_abs/build/libs/$asset_name"
          mv "$built" "$asset"
          echo "jar_path=$asset" >> "$GITHUB_OUTPUT"

      - name: Archive tested source and publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          BUILD_VERSION: ${{ steps.meta.outputs.build_version }}
          RELEASE_VERSION: ${{ steps.meta.outputs.release_version }}
          JAVA_VERSION: ${{ steps.meta.outputs.java_version }}
          MC_VERSION: ${{ steps.meta.outputs.expected_mc }}
          REPO_DIR: ${{ steps.meta.outputs.repo_dir }}
          JAR_PATH: ${{ steps.asset.outputs.jar_path }}
        shell: bash
        run: |
          set -euo pipefail
          CHANNEL_TAG="$CHANNEL"
          TITLE="$RELEASE_VERSION (NeoForge $CHANNEL)"

          git -C "$REPO_DIR" config user.email "ci@github-actions.local"
          git -C "$REPO_DIR" config user.name "GitHub Actions"

          if [[ "$CHANNEL" == "26.3" ]]; then
            ARCHIVE_TAG="archive/releases/$CHANNEL/$SOURCE_SHA"
            if ! git -C "$REPO_DIR" ls-remote --exit-code --tags origin "refs/tags/$ARCHIVE_TAG" >/dev/null 2>&1; then
              git -C "$REPO_DIR" tag -a "$ARCHIVE_TAG" "$SOURCE_SHA" -m "Rollback point for Minecraft $CHANNEL ($SOURCE_SHA)"
              git -C "$REPO_DIR" push origin "refs/tags/$ARCHIVE_TAG"
            fi
            TAG_TARGET="$SOURCE_SHA"
          else
            # GitHub's built-in GITHUB_TOKEN cannot create a release tag directly on a
            # commit that changes .github/workflows relative to main. Build a snapshot
            # from the exact 1.21.1 tree while inheriting main's workflow directory.
            # The real source SHA and a source ZIP are separately attached to this release.
            git -C "$REPO_DIR" fetch origin main:refs/remotes/origin/main
            MAIN_SHA="$(git -C "$REPO_DIR" rev-parse refs/remotes/origin/main)"
            TREE_WORKDIR="$RUNNER_TEMP/release-source-tree"
            git -C "$REPO_DIR" worktree add --detach "$TREE_WORKDIR" "$MAIN_SHA"
            git -C "$TREE_WORKDIR" rm -r --cached -f .
            git -C "$TREE_WORKDIR" clean -fdx
            git -C "$REPO_DIR" archive "$SOURCE_SHA" | tar -xf - -C "$TREE_WORKDIR"
            git -C "$TREE_WORKDIR" checkout --force "$MAIN_SHA" -- .github/workflows
            git -C "$TREE_WORKDIR" add -A
            TREE_SHA="$(git -C "$TREE_WORKDIR" write-tree)"
            TAG_TARGET="$(printf 'Release snapshot for Minecraft 1.21.1; source %s\n' "$SOURCE_SHA" | git -C "$TREE_WORKDIR" commit-tree "$TREE_SHA" -p "$MAIN_SHA")"
            git -C "$REPO_DIR" worktree remove "$TREE_WORKDIR" --force
          fi

          PREVIOUS_BODY=""
          if gh release view "$CHANNEL_TAG" --repo "$REPO" >/dev/null 2>&1; then
            PREVIOUS_BODY="$(gh release view "$CHANNEL_TAG" --repo "$REPO" --json body --jq .body)"
          fi
          export PREVIOUS_BODY

          NOTES_FILE="$RUNNER_TEMP/release-notes-$CHANNEL.md"
          python3 - "$NOTES_FILE" <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          repo = os.environ["REPO"]
          channel = os.environ["CHANNEL"]
          source_sha = os.environ["SOURCE_SHA"]
          build_version = os.environ["BUILD_VERSION"]
          release_version = os.environ["RELEASE_VERSION"]
          mc_version = os.environ["MC_VERSION"]
          java_version = os.environ["JAVA_VERSION"]
          repo_dir = os.environ["REPO_DIR"]
          previous_body = os.environ.get("PREVIOUS_BODY", "")
          marker = re.search(r"<!-- release-source-sha: ([0-9a-f]{40}) -->", previous_body)
          previous_sha = marker.group(1) if marker else ""
          source_url = f"https://github.com/{repo}/commit/{source_sha}"
          compare_url = f"https://github.com/{repo}/compare/{previous_sha}...{source_sha}" if previous_sha and previous_sha != source_sha else ""

          def gh_json(endpoint):
              result = subprocess.run(["gh", "api", endpoint], check=True, capture_output=True, text=True)
              return json.loads(result.stdout)

          if compare_url:
              try:
                  commits = gh_json(f"repos/{repo}/compare/{previous_sha}...{source_sha}").get("commits", [])
              except Exception:
                  commits = []
          else:
              log = subprocess.run(
                  ["git", "-C", repo_dir, "log", "-n", "12", "--format=%H%x1f%s"],
                  check=True, capture_output=True, text=True,
              ).stdout.splitlines()
              commits = []
              for line in log:
                  parts = line.split("\x1f", 1)
                  if len(parts) == 2:
                      commits.append({"sha": parts[0], "commit": {"message": parts[1]}})

          commit_lines = []
          pr_map = {}
          for item in commits:
              sha = item.get("sha", "")
              message = item.get("commit", {}).get("message", "").splitlines()[0]
              if not sha:
                  continue
              commit_lines.append(f"- [{sha[:7]}](https://github.com/{repo}/commit/{sha}) — {message}")
              try:
                  for pr in gh_json(f"repos/{repo}/commits/{sha}/pulls"):
                      if pr.get("html_url") and pr.get("number"):
                          pr_map[pr["number"]] = (pr["html_url"], pr.get("title", f"PR #{pr['number']}"))
              except Exception:
                  pass
              for number in re.findall(r"\(#(\d+)\)", message):
                  pr_map.setdefault(int(number), (f"https://github.com/{repo}/pull/{number}", f"PR #{number}"))

          if channel == "26.3":
              bullets = [
                  "Minecraft 26.3 / NeoForge 26.3 build; Java 25.",
                  "Includes the core content: seven sin aspects, shards, taint content, morph tools, Mob Crystal and Wrath Cage, wand items, Blink Focus, enchantments, recipes, and research.",
                  "Builds the host and add-on, checks artifact provenance, and runs GameTests with no_lust=false and no_lust=true.",
                  f"Known parity gaps and client-visual checks are tracked in the [fidelity ledger](https://github.com/{repo}/blob/{source_sha}/docs/fidelity.md).",
              ]
          else:
              bullets = [
                  "Minecraft 1.21.1 / NeoForge 21.1.x build; Java 21.",
                  "Includes the core content port: aspects and shards, taint materials and tree, morph tools, Mob Crystal and Wrath Cage, wand rods, Blink Focus upgrades, enchantments, recipes, and research.",
                  "Builds the pinned Thaumcraft host and add-on, verifies host preparation and artifact provenance, and runs GameTests.",
                  "Automated validation covers the test server; graphical client verification remains a separate manual check.",
              ]

          commit_subject = subprocess.run(
              ["git", "-C", repo_dir, "show", "-s", "--format=%s", source_sha],
              check=True, capture_output=True, text=True,
          ).stdout.strip()

          lines = [
              f"Version {release_version} for Minecraft {mc_version}",
              "",
              f"`{source_sha[:7]}`: {commit_subject}",
          ]
          if compare_url:
              lines += ["", f"[Changes since previous build]({compare_url})"]
          lines += ["", f"<!-- release-source-sha: {source_sha} -->"]

          with open(sys.argv[1], "w", encoding="utf-8", newline="\n") as output:
              output.write("\n".join(lines) + "\n")
          PY

          git -C "$REPO_DIR" tag -f -a "$CHANNEL_TAG" "$TAG_TARGET" -m "Latest tested Minecraft $CHANNEL build from source $SOURCE_SHA"
          git -C "$REPO_DIR" push --force origin "refs/tags/$CHANNEL_TAG"

          # Recreate the rolling release instead of editing it: GitHub derives the
          # "released ..." date from the release, not from the asset, so an edit would
          # keep showing the first build date. The tag is kept for rollback history.
          if gh release view "$CHANNEL_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release delete "$CHANNEL_TAG" --repo "$REPO" --yes --cleanup-tag=false
          fi
          gh release create "$CHANNEL_TAG" --repo "$REPO" --target "$TAG_TARGET" --title "$TITLE" --notes-file "$NOTES_FILE"

          # This is a rolling release, not a build archive: remove only assets managed
          # by this workflow before uploading the current, predictable filenames.
          RELEASE_ID="$(gh api "repos/$REPO/releases/tags/$CHANNEL_TAG" --jq .id)"
          while read -r ASSET_ID ASSET_NAME; do
            [[ -n "$ASSET_ID" && -n "$ASSET_NAME" ]] || continue
            if [[ "$ASSET_NAME" == forbidden-magic-* ]]; then
              gh api "repos/$REPO/releases/assets/$ASSET_ID" --method DELETE >/dev/null
              echo "Removed obsolete release asset: $ASSET_NAME"
            fi
          done < <(gh api "repos/$REPO/releases/$RELEASE_ID/assets?per_page=100" --jq '.[] | [.id, .name] | @tsv')

          gh release upload "$CHANNEL_TAG" "$JAR_PATH" --repo "$REPO"
          echo "Updated release $CHANNEL_TAG from $SOURCE_SHA. The other Minecraft channel was not touched."
