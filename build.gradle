plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "forbidden-magic"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version))

sourceSets {
    client {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            sourceSet = sourceSets.client
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            programArgument '--tests'
            programArgument "${mod_id}:*"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven { url = uri("https://api.modrinth.com/maven") }
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
        content {
            includeGroup "mezz.jei"
            includeGroup "net.mezzdev.config"
        }
    }
    maven {
        name = "IllusiveSoulworks"
        url = "https://maven.theillusivec4.top/"
        content {
            includeGroup "top.theillusivec4.curios"
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    clientRuntimeClasspath.extendsFrom runtimeClasspath
}

def thaumaturgeJar = null
def explicitJar = providers.gradleProperty('thaumaturge_jar')
if (explicitJar.isPresent()) {
    thaumaturgeJar = file(explicitJar.get())
} else {
    ['../Thaumaturge', '../../../Thaumaturge'].each { base ->
        if (thaumaturgeJar != null) {
            return
        }
        def libs = file("${base}/build/libs")
        if (!libs.isDirectory()) {
            return
        }
        def candidate = libs.listFiles()?.findAll {
            it.name.startsWith('thaumaturge-') && it.name.endsWith("-${thaumaturge_version}.jar") &&
                !it.name.contains('sources') && !it.name.contains('javadoc')
        }?.sort { it.name }?.last()
        if (candidate != null) {
            thaumaturgeJar = candidate
        }
    }
}
if (thaumaturgeJar == null || !thaumaturgeJar.isFile()) {
    throw new GradleException("Thaumaturge ${thaumaturge_version} jar not found. Build ../Thaumaturge or pass -Pthaumaturge_jar=<path>.")
}

dependencies {
    compileOnly files(thaumaturgeJar)
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}+${minecraft_version}:api"
    localRuntime files(thaumaturgeJar)
    localRuntime "maven.modrinth:lithostitched:${lithostitched_version}"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}+${minecraft_version}"
    clientRuntimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

tasks.named('jar', Jar) {
    archiveFileName = "forbidden-magic-${mod_version}.jar"
}

sourceSets.main.java.srcDirs = ['src/thaumaturge/java', 'src/thaumaturge/tests/java']
sourceSets.main.resources.srcDirs = ['src/thaumaturge/resources', 'src/main/resources/assets']

def generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        neo_version: neo_version, mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        mod_authors: mod_authors, mod_credits: mod_credits, mod_description: mod_description,
        thaumaturge_version: thaumaturge_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.register('verify', GradleBuild) { }
