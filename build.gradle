plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = "forbidden-magic"
}

sourceSets {
    client {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version))

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
            sourceSet = sourceSets.client
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            // These tests use vanilla's empty structure template, so permit both the addon namespace and minecraft.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven { url = uri("maven") }
    mavenCentral()
    maven {
        name = "Curios"
        url = uri("https://maven.theillusivec4.top/")
    }

    maven {
        name = "Minecraft Forge"
        url = uri("https://maven.minecraftforge.net/")
        content {
            includeGroup "com.github.glitchfiend"
        }
    }

    maven {
        name = "BlameJared"
        url = uri("https://maven.blamejared.com/")
        content {
            includeGroup "mezz.jei"
            includeGroup "net.mezzdev.config"
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    clientRuntimeClasspath.extendsFrom runtimeClasspath
}

if (file('host').isDirectory()) {
    def hostProperties = new java.util.Properties()
    file('host/gradle.properties').withInputStream { hostProperties.load(it) }
    def hostVersion = hostProperties.getProperty('mod_version')
    if (hostVersion != thaumcraft_version) {
        throw new GradleException("host/ is version ${hostVersion} but thaumcraft_version is ${thaumcraft_version}; run tools/prepare_host.py")
    }
}

def tinkererApiJar = layout.buildDirectory.file(
    "optional-api/thaumic-tinkerer-reforged-1.1.3-1.21.1.jar"
)
def tinkererApiUrl = "https://github.com/notlikethiss/thaumic-tinkerer-reforged/releases/download/1.21.1/thaumic-tinkerer-reforged-1.1.3-1.21.1.jar"
def tinkererApiSha256 = "8af77b4bd9ade42b1867389c7d74a48837e0a436ee9ba0ffef6c90963b26b9e8"

def downloadTinkererCompileApi = tasks.register("downloadTinkererCompileApi") {
    outputs.file(tinkererApiJar)
    outputs.upToDateWhen { false }
    doLast {
        File destination = tinkererApiJar.get().asFile
        destination.parentFile.mkdirs()

        def digest = { File file ->
            java.security.MessageDigest.getInstance("SHA-256")
                .digest(file.bytes)
                .encodeHex()
                .toString()
        }

        if (destination.isFile() && digest(destination) == tinkererApiSha256) {
            return
        }

        File temporary = new File(destination.parentFile, destination.name + ".part")
        if (temporary.exists()) {
            temporary.delete()
        }
        new URL(tinkererApiUrl).withInputStream { input ->
            temporary.withOutputStream { output ->
                output << input
            }
        }

        String actualSha256 = digest(temporary)
        if (actualSha256 != tinkererApiSha256) {
            temporary.delete()
            throw new GradleException(
                "Thaumic Tinkerer compile API checksum mismatch: expected ${tinkererApiSha256}, got ${actualSha256}"
            )
        }

        if (destination.exists() && !destination.delete()) {
            temporary.delete()
            throw new GradleException("Could not replace stale Thaumic Tinkerer compile API at ${destination}")
        }
        if (!temporary.renameTo(destination)) {
            destination.bytes = temporary.bytes
            temporary.delete()
        }
    }
}

dependencies {
    implementation "com.github.glitchfiend:TerraBlender-neoforge:${terrablender_version}"

    compileOnly "thaumcraft:thaumcraft:${thaumcraft_version}"
    compileOnly files(tinkererApiJar)
    localRuntime "thaumcraft:thaumcraft:${thaumcraft_version}"
    // Thaumcraft 1.21.1 has a mandatory Curios runtime dependency; include it in GameTest runs.
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    clientRuntimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named('compileJava') {
    dependsOn(downloadTinkererCompileApi)
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events "failed", "skipped"
        exceptionFormat "full"
    }
}

tasks.named('jar', Jar) {
    archiveFileName = "forbidden-magic-${mod_version}.jar"
}

def tinkererVerifiedModJar = layout.buildDirectory.file("libs/forbidden-magic-${mod_version}.jar")
def verifyTinkererCompileOnly = tasks.register("verifyTinkererCompileOnly") {
    dependsOn(tasks.named('jar', Jar))
    doLast {
        File modJar = tinkererVerifiedModJar.get().asFile
        new java.util.jar.JarFile(modJar).withCloseable { archive ->
            def entries = archive.entries()
            while (entries.hasMoreElements()) {
                def entry = entries.nextElement()
                if (entry.name.startsWith("thaumictinkerer/")) {
                    throw new GradleException(
                        "Optional Thaumic Tinkerer API leaked into the Forbidden Magic JAR: ${entry.name}"
                    )
                }
            }
        }
    }
}

tasks.named('build') {
    dependsOn(verifyTinkererCompileOnly)
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
}
sourceSets.main.java {
    srcDir('tests/java')
}

def generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_license: mod_license,
        mod_authors: mod_authors,
        mod_credits: mod_credits,
        mod_description: mod_description,
        thaumcraft_version: thaumcraft_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('verify', GradleBuild) { }
